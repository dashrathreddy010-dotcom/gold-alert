name: XAUUSD HM Alert

on:
  schedule:
    # 4H bot: check 4 times in each hour a 4H candle closes (UTC)
    - cron: "1,16,31,46 0,4,8,12,16,20 * * *"
    # 15-minute bot: after every 15m candle close, Mon-Fri, 06:00-20:59 UTC
    - cron: "2,17,32,47 6-20 * * 1-5"
  workflow_dispatch:
    inputs:
      run:
        description: "What to run"
        type: choice
        options:
          - test-15m
          - 15m
          - test-1m
          - 1m
          - test-4h
          - 4h
        default: test-15m

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests pandas numpy

      - name: Run bot
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.run }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$RUN_MODE" = "test-15m" ]; then python hm_alert_15m.py --test
          elif [ "$RUN_MODE" = "15m" ]; then python hm_alert_15m.py
          elif [ "$RUN_MODE" = "test-1m" ]; then python hm_alert_1m.py --test
          elif [ "$RUN_MODE" = "1m" ]; then python hm_alert_1m.py
          elif [ "$RUN_MODE" = "test-4h" ]; then python hm_alert.py --test
          elif [ "$RUN_MODE" = "4h" ]; then python hm_alert.py
          elif [ "$SCHEDULE" = "2,17,32,47 6-20 * * 1-5" ]; then python hm_alert_15m.py
          else python hm_alert.py
          fi

      - name: Save state
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git pull --rebase || true
          git add hm_state.json hm_state_1m.json hm_state_15m.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
