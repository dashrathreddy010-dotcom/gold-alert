name: XAUUSD HM Alert

on:
  schedule:
    # 4H candles close at 00,04,08,12,16,20 UTC. Check 4 times in each of those hours.
    - cron: "1,16,31,46 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message only"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests pandas numpy

      - name: Run bot
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python hm_alert.py --test
          else
            python hm_alert.py
          fi

      - name: Save state
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add hm_state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
