name: XAUUSD HM Alert

on:
  workflow_dispatch:
    inputs:
      run:
        description: "What to run"
        type: choice
        options:
          - test-1d
          - 1d
          - test-1h
          - 1h
          - test-15m
          - 15m
          - test-4h
          - 4h
          - test-1m
          - 1m
        default: test-1d

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests pandas numpy

      - name: Run bots
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.run }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          rc=0
          run() { echo "---- $* ----"; python "$@" || rc=1; }
          case "$RUN_MODE" in
            test-1d)  run hm_alert_1d.py --test ;;
            1d)       run hm_alert_1d.py ;;
            test-1h)  run hm_alert_1h.py --test ;;
            1h)       run hm_alert_1h.py ;;
            test-15m) run hm_alert_15m.py --test ;;
            15m)      run hm_alert_15m.py ;;
            test-4h)  run hm_alert.py --test ;;
            4h)       run hm_alert.py ;;
            test-1m)  run hm_alert_1m.py --test ;;
            1m)       run hm_alert_1m.py ;;
            *)
              run hm_alert_15m.py
              run hm_alert_1h.py
              run hm_alert.py
              run hm_alert_1d.py
              ;;
          esac
          exit $rc

      - name: Save state
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git pull --rebase || true
          git add hm_state.json hm_state_1m.json hm_state_15m.json hm_state_1h.json hm_state_1d.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
