name: XAUUSD HM Alert

on:
  schedule:
    # Market hours (Mon-Fri 06:00-20:59 UTC): after every 15m candle close.
    # Runs 15m + 1H + 4H bots together.
    - cron: "2,17,32,47 6-20 * * 1-5"
    # Off hours (Mon-Fri 21:00-05:59 UTC): twice an hour. Runs 1H + 4H bots.
    - cron: "2,32 21-23,0-5 * * 1-5"
  workflow_dispatch:
    inputs:
      run:
        description: "What to run"
        type: choice
        options:
          - test-1h
          - 1h
          - test-15m
          - 15m
          - test-4h
          - 4h
          - test-1m
          - 1m
        default: test-1h

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests pandas numpy

      - name: Run bots
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.run }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          rc=0
          run() { echo "---- $* ----"; python "$@" || rc=1; }
          case "$RUN_MODE" in
            test-1h)  run hm_alert_1h.py --test ;;
            1h)       run hm_alert_1h.py ;;
            test-15m) run hm_alert_15m.py --test ;;
            15m)      run hm_alert_15m.py ;;
            test-4h)  run hm_alert.py --test ;;
            4h)       run hm_alert.py ;;
            test-1m)  run hm_alert_1m.py --test ;;
            1m)       run hm_alert_1m.py ;;
            *)
              if [ "$SCHEDULE" = "2,17,32,47 6-20 * * 1-5" ]; then
                run hm_alert_15m.py
              fi
              run hm_alert_1h.py
              run hm_alert.py
              ;;
          esac
          exit $rc

      - name: Save state
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git pull --rebase || true
          git add hm_state.json hm_state_1m.json hm_state_15m.json hm_state_1h.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
